[package]
name = "audiobook-splitter-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
epub = "2"
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
whisper-rs = "0.16"
# Only for ggml's device list (is a GPU actually in use?); same version whisper-rs builds.
whisper-rs-sys = "0.15"

# Metal (Apple GPU) only exists on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# Vulkan runs on NVIDIA, AMD and Intel GPUs through the driver's vulkan-1.dll, so one
# build covers them all; whisper.cpp falls back to the CPU if no Vulkan device is found.
# Building needs the Vulkan SDK (VULKAN_SDK set). Linux supports the same backend: widen
# this to cfg(any(windows, target_os = "linux")) and install libvulkan-dev and glslc.
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[dev-dependencies]
zip = "9.0.2"
